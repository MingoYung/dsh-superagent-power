name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: DSH ${{ matrix.dsh }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.2.1-rc.4
            cordis: 4.0.5
          - dsh: 0.2.1-rc.5
            cordis: 4.0.5
          - dsh: 0.2.2-rc.1
            cordis: 4.1.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select host compatibility version
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          "@deepseek-ai/cordis@${{ matrix.cordis }}"
          "@deepseek-ai/dsh-typert-protocol@${{ matrix.dsh }}"
          "@deepseek-ai/dsh-client-connection@${{ matrix.dsh }}"
          "@deepseek-ai/dsh-api-gateway@${{ matrix.dsh }}"
          "@deepseek-ai/dsh-api-remote-access@${{ matrix.dsh }}"
          "@deepseek-ai/dsh-typert-registry@${{ matrix.dsh }}"
      - run: npm run check
      - run: npm pack --dry-run
